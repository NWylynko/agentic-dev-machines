apiVersion: v1
kind: Namespace
metadata:
  name: adm-system
  labels:
    app.kubernetes.io/part-of: adm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adm-lifecycle
  namespace: adm-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adm-lifecycle
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Moving Pods off a dead node is adm-failover's job (TASK-91).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["adm-runtime"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  # Each coding workspace gets a read-only PersistentVolume onto the shared
  # repository bases volume, since a claim cannot cross namespaces (TASK-113).
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adm-lifecycle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adm-lifecycle
subjects:
  - kind: ServiceAccount
    name: adm-lifecycle
    namespace: adm-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adm-lifecycle-kubeconfig
  namespace: adm-system
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: lifecycle
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: lifecycle
        context:
          cluster: in-cluster
          user: lifecycle
          namespace: adm-system
    current-context: lifecycle
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adm-lifecycle-state
  namespace: adm-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: adm-replicated
  resources:
    requests:
      storage: 1Gi
---
# One bare clone ("base") per registered repository, shared read-only by every
# coding workspace so a repository is stored once (TASK-113). Needs a
# StorageClass that supports ReadWriteMany; see deploy/storage.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adm-repository-bases
  namespace: adm-system
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: adm-replicated
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adm-lifecycle
  namespace: adm-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adm-lifecycle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adm-lifecycle
    spec:
      serviceAccountName: adm-lifecycle
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: prepare-state
          image: ghcr.io/nwylynko/agentic-dev-machines:latest
          command: ["chown", "-R", "1000:1000", "/var/lib/adm", "/var/lib/adm-repository-bases"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: state
              mountPath: /var/lib/adm
            - name: repository-bases
              mountPath: /var/lib/adm-repository-bases
      containers:
        - name: lifecycle
          image: ghcr.io/nwylynko/agentic-dev-machines:latest
          imagePullPolicy: IfNotPresent
          command: ["adm"]
          args: ["--state-dir", "/var/lib/adm/lifecycle", "--lifecycle-token-file", "/var/run/adm-secret/token", "lifecycle-serve", "--host", "0.0.0.0", "--port", "7433"]
          env:
            - name: KUBECONFIG
              value: /etc/adm/config
            - name: ADM_LIFECYCLE_IDENTITY_TOKEN_FILE
              value: /var/run/adm-identity/token
            - name: ADM_LIFECYCLE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ADM_REPOSITORY_BASES
              value: /var/lib/adm-repository-bases
          ports:
            - name: http
              containerPort: 7433
          # A request gives the lifecycle a fair CPU share on a busy node (TASK-96).
          resources:
            requests:
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /var/lib/adm
            - name: kubeconfig
              mountPath: /etc/adm
              readOnly: true
            - name: token
              mountPath: /var/run/adm-secret
              readOnly: true
            - name: identity
              mountPath: /var/run/adm-identity
              readOnly: true
            - name: repository-bases
              mountPath: /var/lib/adm-repository-bases
        - name: provider-auth
          image: ghcr.io/nwylynko/agentic-dev-machines:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "/opt/adm/provider-auth.mjs"]
          args: ["--probe-port", "7435"]
          ports:
            - name: provider-auth
              containerPort: 7434
            - name: auth-liveness
              containerPort: 7435
          # No readinessProbe: provider-auth must not take the lifecycle Service
          # offline (TASK-94). The authority itself stays loopback-only; 7435
          # answers only liveness on the Pod IP for kubelet.
          livenessProbe:
            httpGet:
              path: /health
              port: auth-liveness
            timeoutSeconds: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /var/lib/adm
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: adm-lifecycle-state
        - name: repository-bases
          persistentVolumeClaim:
            claimName: adm-repository-bases
        - name: kubeconfig
          configMap:
            name: adm-lifecycle-kubeconfig
        - name: token
          secret:
            secretName: adm-lifecycle-token
            defaultMode: 0440
        - name: identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: adm-lifecycle
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: adm-lifecycle
  namespace: adm-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: adm-lifecycle
  ports:
    - name: http
      port: 7433
      targetPort: http
---
# Node failover (TASK-82, TASK-91): force deletes ADM workspace Pods and the
# lifecycle Pod on a node NotReady for 180 s and deletes their
# VolumeAttachments there, so RWO volumes attach on a healthy node. Outside the
# lifecycle so it survives the lifecycle's node; two replicas on different
# nodes, no volume and no lock (every action is idempotent).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adm-failover
  namespace: adm-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adm-failover
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # Which volumes are ADM's: claimed from adm-system or an ADM namespace.
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adm-failover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adm-failover
subjects:
  - kind: ServiceAccount
    name: adm-failover
    namespace: adm-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adm-failover
  namespace: adm-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: adm-failover
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adm-failover
    spec:
      serviceAccountName: adm-failover
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: adm-failover
      containers:
        - name: failover
          image: ghcr.io/nwylynko/agentic-dev-machines:latest
          imagePullPolicy: IfNotPresent
          command: ["adm"]
          args: ["failover-serve"]
          env:
            - name: KUBECONFIG
              value: /etc/adm/config
            - name: ADM_LIFECYCLE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/adm
              readOnly: true
      volumes:
        # Same in-cluster kubeconfig as the lifecycle; it reads this Pod's own
        # ServiceAccount token.
        - name: kubeconfig
          configMap:
            name: adm-lifecycle-kubeconfig
