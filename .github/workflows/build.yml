# Verifies the CLI, runner, and terminal, then publishes the linux/amd64
# management-host distribution, its GitHub release, and the ADM role images.
# Markdown-only pushes and pull requests do not run this workflow. FUSE
# repository tests stay local: this runner does not provide a usable /dev/fuse mount.

name: Build

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    tags: ["v[0-9]*"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/repositories/go.mod
          cache-dependency-path: packages/repositories/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install test dependencies
        run: |
          set -eu
          curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y zsh /tmp/chrome.deb
          test -x /usr/bin/google-chrome-stable
          zsh --version

      - run: npm ci
      - run: npm run test:pi-patch

      - name: Build adm-repositories
        run: CGO_ENABLED=0 go build -C packages/repositories -trimpath -ldflags='-s -w' -o /tmp/adm-repositories .

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: npm run check
      - run: npm test
      - run: npm run test:install
      - run: npm run test:publish

  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v4

      - name: Build, inspect and smoke test role images
        run: |
          set -eu
          for role in adm-control adm-repositories adm-workspace adm-code adm-bot; do
            docker build --platform linux/amd64 --target "$role" -f image/Dockerfile -t "$role:ci" .
            id=$(docker create "$role:ci")
            mkdir -p "/tmp/$role-root"
            docker export "$id" | tar -xf - -C "/tmp/$role-root"
            docker rm "$id" >/dev/null
            node image/scan-secrets.mjs "/tmp/$role-root"
            npm run test:image -- "$role:ci" "$role"
          done
          node --test image/secret-scan.test.mjs

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish role images
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          repo="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          sha="sha-${GITHUB_SHA::12}"
          tags="$sha"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="$tags latest"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="$tags $version $GITHUB_REF_NAME latest"
          fi
          {
            echo "## ADM role images"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for tag in $tags; do
            for role in adm-control adm-repositories adm-workspace adm-code adm-bot; do
              image="$repo/$role"
              docker tag "$role:ci" "$image:$tag"
              docker push "$image:$tag"
              echo "- \`$image:$tag\`" >> "$GITHUB_STEP_SUMMARY"
              echo "pushed $image:$tag"
            done
          done

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/repositories/go.mod
          cache-dependency-path: packages/repositories/go.sum

      - run: npm ci --ignore-scripts

      - name: Install release test dependencies
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y zsh
          zsh --version

      - name: Build release binaries
        run: |
          set -eu
          cargo build --release --locked
          if [ "${{ runner.os }}" = Linux ]; then
            CGO_ENABLED=0 go build -C packages/repositories -trimpath -ldflags='-s -w' -o /tmp/adm-repositories .
          fi

      - name: Package native client release
        run: |
          set -eu
          version="sha-${GITHUB_SHA::12}"
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; fi
          args=""
          if [ "${{ runner.os }}" = Linux ]; then args="--repositories /tmp/adm-repositories"; fi
          node scripts/build-release.mjs \
            --version "$version" \
            --control-image "$image/adm-control:sha-${GITHUB_SHA::12}" \
            --repositories-image "$image/adm-repositories:sha-${GITHUB_SHA::12}" \
            --workspace-image "$image/adm-workspace:sha-${GITHUB_SHA::12}" \
            --code-image "$image/adm-code:sha-${GITHUB_SHA::12}" \
            --bot-image "$image/adm-bot:sha-${GITHUB_SHA::12}" \
            --adm target/release/adm $args \
            --output "dist/${{ matrix.platform }}"
          cp install.sh "dist/${{ matrix.platform }}/install.sh"

      - name: Verify standalone runtime and Code Mode assets
        if: runner.os == 'Linux'
        env:
          ADM_RELEASE_TEST_ADM: ${{ github.workspace }}/target/release/adm
        run: npm run test:release

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: adm-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [image, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: actions/download-artifact@v8
        with:
          pattern: adm-*
          path: dist
          merge-multiple: false

      - name: Assemble all platform assets and checksums
        run: node scripts/assemble-release.mjs --dist dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo="${GITHUB_REPOSITORY:?}"
          image="ghcr.io/$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')"
          sha_tag="sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${sha_tag}"
          fi
          api_error=$(mktemp)
          trap 'rm -f "$api_error"' EXIT

          set +e
          draft=$(gh api "repos/${repo}/releases/tags/${tag}" --jq .draft 2>"$api_error")
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            if [ "$draft" = "true" ]; then
              echo "Release ${tag} is a draft, so it is not the published download." >&2
              exit 1
            fi
            echo "Release ${tag} already exists; leaving its assets unchanged."
            exit 0
          fi
          if ! grep -q "HTTP 404" "$api_error"; then
            cat "$api_error" >&2
            exit "$status"
          fi

          # A main build becomes the installer's default only when this commit is
          # ahead of the current latest release tag, or is that same commit.
          # Compare the tag, not its recorded target: that target may be a moving
          # branch name. Version tags stay pinned. An older or unrelated rerun
          # keeps its own assets.
          latest=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            set +e
            latest_tag=$(gh api "repos/${repo}/releases/latest" --jq .tag_name 2>"$api_error")
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              comparison=$(gh api "repos/${repo}/compare/${latest_tag}...${GITHUB_SHA}" --jq .status)
              case "$comparison" in
                ahead|identical) latest=true ;;
                behind|diverged) latest=false ;;
                *)
                  echo "Unexpected compare status '${comparison}' between ${latest_tag} and ${GITHUB_SHA}." >&2
                  exit 1
                  ;;
              esac
            elif grep -q "HTTP 404" "$api_error"; then
              latest=true
            else
              cat "$api_error" >&2
              exit "$status"
            fi
          fi

          cat > release-notes.md <<EOF
          ## Install or update

          Native client distributions for macOS x86_64/arm64 and Linux amd64/arm64, including the runner, terminal, and platform-specific Node dependencies. Requires Node.js 24 or newer. No checkout or build toolchain is needed.

          \`\`\`sh
          curl -fsSL https://github.com/${repo}/releases/download/${tag}/install.sh | sh -s -- --version ${tag}
          \`\`\`

          Omit \`--version\` to install or update to the latest successful main release while preserving settings and workspace state. First installation offers \`adm setup\`. ADM publishes separate linux/amd64 images for each role.

          ## Role images

          - Controller: \`${image}/adm-control:${sha_tag}\`
          - Repository sidecar: \`${image}/adm-repositories:${sha_tag}\`
          - Shared workspace base: \`${image}/adm-workspace:${sha_tag}\`
          - Coding agents: \`${image}/adm-code:${sha_tag}\`
          - Bots: \`${image}/adm-bot:${sha_tag}\`

          linux/amd64.

          \`\`\`sh
          adm create my-project --role coding --image ${image}/adm-code:${sha_tag} --model PROVIDER/MODEL_ID
          \`\`\`

          If the GHCR package is private, the cluster needs a pull credential before Kubernetes can fetch it.
          EOF

          echo "Publishing ${tag} at ${GITHUB_SHA} (latest=${latest})."
          gh release create "$tag" \
            --repo "$repo" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md \
            --latest="$latest" \
            dist/release/adm-linux-amd64.tar.gz \
            dist/release/adm-linux-arm64.tar.gz \
            dist/release/adm-darwin-amd64.tar.gz \
            dist/release/adm-darwin-arm64.tar.gz \
            dist/release/install.sh \
            dist/release/LICENSE \
            dist/release/adm-linux-amd64 \
            dist/release/adm-linux-arm64 \
            dist/release/adm-darwin-amd64 \
            dist/release/adm-darwin-arm64 \
            dist/release/adm-repositories-linux-amd64 \
            dist/release/adm-repositories-linux-arm64 \
            dist/release/SHA256SUMS
