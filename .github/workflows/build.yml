# Verifies the CLI, runner, and terminal, then publishes the linux/amd64
# management-host binaries and the workspace image. FUSE repository tests stay
# local: this runner does not provide a usable /dev/fuse mount.

name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/repositories/go.mod
          cache-dependency-path: packages/repositories/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Chrome
        run: |
          set -eu
          curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb
          test -x /usr/bin/google-chrome-stable

      - run: npm ci

      - name: Build adm-repositories
        run: CGO_ENABLED=0 go build -C packages/repositories -trimpath -ldflags='-s -w' -o /tmp/adm-repositories .

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: npm run check
      - run: npm test

  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - uses: docker/setup-buildx-action@v4

      - name: Build workspace image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: image/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: adm-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=adm-dev
            org.opencontainers.image.description=ADM development workspace

      - name: Smoke test workspace image
        run: node image/smoke.mjs adm-dev:ci

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish workspace image
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          sha="sha-${GITHUB_SHA::12}"
          tags="$sha"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="$tags latest"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="$tags $version $GITHUB_REF_NAME latest"
          fi
          {
            echo "## Workspace image"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for tag in $tags; do
            docker tag adm-dev:ci "$image:$tag"
            docker push "$image:$tag"
            echo "- \`$image:$tag\`" >> "$GITHUB_STEP_SUMMARY"
            echo "pushed $image:$tag"
          done

  binaries:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/repositories/go.mod
          cache-dependency-path: packages/repositories/go.sum

      - name: Build release binaries
        run: |
          set -eu
          mkdir -p dist
          cargo build --release --locked
          cp target/release/adm dist/adm-linux-amd64
          CGO_ENABLED=0 go build -C packages/repositories -trimpath -ldflags='-s -w' -o "$PWD/dist/adm-repositories-linux-amd64" .
          chmod 755 dist/adm-linux-amd64 dist/adm-repositories-linux-amd64
          (
            cd dist
            sha256sum adm-linux-amd64 adm-repositories-linux-amd64 > SHA256SUMS
          )

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: adm-linux-amd64
          path: dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: adm-linux-amd64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## CLI

          linux/amd64 binaries for the Debian management host. \`adm\` still launches the runner and terminal from this checkout, including its installed npm dependencies.

          \`\`\`sh
          install -m 755 adm-linux-amd64 "\$HOME/.local/bin/adm"
          install -m 755 adm-repositories-linux-amd64 "\$HOME/.local/bin/adm-repositories"
          \`\`\`

          Run \`adm\` from the checkout, or pass \`--project-dir\` / \`ADM_PROJECT_DIR\`. A binary compiled on the management host keeps using that checkout while the build path still exists.

          ## Workspace image

          \`${image}:${version}\`

          Also published as \`${image}:${GITHUB_REF_NAME}\`, \`${image}:latest\`, and \`sha-<commit>\`. linux/amd64.

          \`\`\`sh
          adm create my-project --image ${image}:${version} --model PROVIDER/MODEL_ID
          \`\`\`

          If the GHCR package is private, the cluster needs a pull credential before Kubernetes can fetch it.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/adm-linux-amd64 \
            dist/adm-repositories-linux-amd64 \
            dist/SHA256SUMS
