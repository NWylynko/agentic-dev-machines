[package]
name = "adm"
version = "0.1.0"
edition = "2024"
description = "Isolated Kubernetes development workspaces and durable agents in Herdr"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "adm"
path = "src/main.rs"
